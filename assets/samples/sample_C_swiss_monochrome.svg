<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Pure Deep Black Background -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#000000"/>
  
  <!-- Architectural Precise Keycap Outline (White) -->
  <rect x="28" y="28" width="72" height="72" rx="14" fill="none" stroke="#ffffff" stroke-width="3"/>
  <rect x="36" y="36" width="56" height="56" rx="8" fill="none" stroke="#444444" stroke-width="1.5"/>
  
  <!-- Minimalist Clean Star Geometry (Braun / Swiss style) -->
  <line x1="64" y1="44" x2="64" y2="84" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="44" y1="64" x2="84" y2="64" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="78" y2="78" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="78" y1="50" x2="50" y2="78" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="5" fill="#000000" stroke="#ffffff" stroke-width="2.5"/>
</svg>
